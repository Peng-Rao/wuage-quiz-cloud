[project]
name = "fg-quiz-server"
version = "0.1.0"
description = "福格云上题库后端：试卷解析服务"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "pymupdf>=1.24",
  "psycopg[binary]>=3.2",
  "redis>=5.2",
  "alibabacloud-oss-v2>=1.4.0",
  "cos-python-sdk-v5>=1.9.44",
  "olefile>=0.47",
]

[dependency-groups]
dev = [
    "fakeredis[lua]>=2.26",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# 固定规则集（pycodestyle 错误 + Pyflakes），升级 Ruff 不会引入新的默认规则
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# 测试复用 test_api 的 client fixture 作参数名；准备数据的短语句写在同一行
"tests/**" = ["F811", "E702"]

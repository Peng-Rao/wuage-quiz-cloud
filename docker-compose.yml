# docker compose up -d --build 后访问 http://localhost:8000
# app 提供页面与接口；worker 从 Redis 任务队列中取出解析、生成答案等任务执行；db 为 PostgreSQL，redis 为任务队列。
# 批量解析时增加 Worker：docker compose up -d --scale worker=3（每个 Worker 同时执行 WORKER_CONCURRENCY 个任务）
# 本地存储时上传文件、页面图保存在 /data 卷中，由 app 与各 worker 共用；改用 COS / OSS 后可跨机器部署

# app 与 worker 共用的配置
x-backend: &backend
  image: fg-quiz-cloud:latest
  # MinerU、大模型等配置（见 server/.env.example）；文件不存在时只以规则 / 轻量解析运行
  env_file:
    - path: server/.env
      required: false
  environment:
    # 默认连接 db 服务（覆盖 server/.env 中的 DATABASE_URL）；容器间通信不走 SSL，
    # 地址中的 sslmode 优先于 server/.env 里可能存在的 PGSSLMODE 等 libpq 变量。
    # 改用外部 PostgreSQL / Redis 时，在仓库根目录的 .env 中设置 DATABASE_URL / REDIS_URL
    DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://fg_quiz:${POSTGRES_PASSWORD:-fg-quiz-local}@db:5432/fg_quiz?sslmode=disable}
    REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  volumes:
    - fg-quiz-data:/data   # 上传文件、页面图
  restart: unless-stopped

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fg_quiz
      POSTGRES_USER: fg_quiz
      # 数据库端口不对外开放，只有 app 能访问；正式部署请在仓库根目录的 .env 中设置 POSTGRES_PASSWORD
      #（密码会写进连接地址，只用字母、数字、- 和 _）
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fg-quiz-local}
    # 只绑定本机地址，供本地开发（uv run uvicorn）和 psql 连接，其他机器访问不到；
    # 用 5433 避免与本机安装的 PostgreSQL（5432）冲突
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - fg-quiz-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fg_quiz -d fg_quiz"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    # AOF 持久化：Redis 重启后队列中的任务不丢
    command: ["redis-server", "--appendonly", "yes"]
    # 同样只绑定本机，供本地开发连接
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - fg-quiz-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    <<: *backend
    build: .
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    <<: *backend
    command: ["python", "-m", "app.worker"]
    # 等 app 完成数据库初始化后再启动
    depends_on:
      app:
        condition: service_healthy
    # 镜像自带的健康检查访问 8000 端口，Worker 不监听端口：改为检查本容器 Worker 的存活标记
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker", "--check"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    # 停止时先把手上的任务交还给其他 Worker
    stop_grace_period: 30s

volumes:
  fg-quiz-data:
  fg-quiz-pg:
  fg-quiz-redis:

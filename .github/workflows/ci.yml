name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支 / PR 的新提交取消尚未完成的旧运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: 前端（类型检查 + 构建）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      # build 已包含 vue-tsc 类型检查；两种模式都构建一遍（模拟数据 / 连接 /api）
      - run: npm run build
      - run: npm run build:api

  backend:
    name: 后端（pytest）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      # --frozen：uv.lock 与 pyproject.toml 不一致时直接失败
      - run: uv sync --frozen
      - run: uv run --frozen pytest -q

  docker:
    name: Docker 镜像构建
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      # 只验证镜像能构建，不推送
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: fg-quiz-cloud:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: 启动容器并检查 /api/health
        run: |
          docker run -d --name app -p 8000:8000 fg-quiz-cloud:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health; then exit 0; fi
            sleep 2
          done
          docker logs app
          exit 1

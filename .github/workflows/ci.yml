name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支 / PR 的新提交取消尚未完成的旧运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: 前端（类型检查 + 构建）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      # build 已包含 vue-tsc 类型检查；两种模式都构建一遍（模拟数据 / 连接 /api）
      - run: npm run build
      - run: npm run build:api

  backend:
    name: 后端（pytest · PostgreSQL + Redis）
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          # 数据库默认时区设为非 UTC，检查时间换算
          TZ: Asia/Shanghai
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: server
    env:
      # 测试库不存在时自动创建；库名须以 _test 结尾
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/fg_quiz_test
      # 任务队列测试连接真实 Redis（未设置时用 fakeredis）
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      # --frozen：uv.lock 与 pyproject.toml 不一致时直接失败
      - run: uv sync --frozen
      - run: uv run --frozen pytest -q

  docker:
    name: Docker 镜像构建与 Compose 启动
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      # 只验证镜像能构建，不推送；标记为 compose 使用的镜像名
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: fg-quiz-cloud:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: 启动 compose（app、worker、PostgreSQL、Redis）并检查 /api/health
        run: |
          docker compose up -d --no-build --wait --wait-timeout 180
          health=$(curl -fsS http://127.0.0.1:8000/api/health)
          echo "$health"
          echo "$health" | python3 -c "import json, sys; w = json.load(sys.stdin)['worker']; assert w['queue'] == 'redis' and w['workers'] >= 1, w"
      - name: 失败时输出日志
        if: failure()
        run: docker compose logs
